name: Deploy Azure Function

# Deploys the Azure Functions backend (src/) to the Function App whenever
# function-related files change on main. The GitHub Pages site itself is
# served separately; this only keeps the weather proxy (/api/weather) live.
#
# One-time setup before this workflow runs (see README.md "Deploy to Azure"):
#   1. Create a free Azure account and a Function App (Node 20, Consumption).
#   2. Set the WEATHER_API_KEY Application Setting on the Function App
#      (portal -> your Function App -> Configuration -> Application settings).
#   3. Download the publish profile (Overview -> Get Publish Profile).
#   4. Add two GitHub repository secrets:
#        - AZURE_FUNCTIONAPP_NAME: the Function App name, e.g. pahimna-api
#        - AZURE_FUNCTIONAPP_PUBLISH_PROFILE: the publish profile XML
#   5. In hytemala/java/wear.js set PROXY_ORIGIN to the Function App URL,
#      e.g. "https://pahimna-api.azurewebsites.net", and push.
#
# Until the secrets exist the deploy step is skipped, so normal CI stays green.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "host.json"
      - "package.json"
      - "package-lock.json"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci requires a package-lock.json, which this repo does not ship,
      # so use npm install instead.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy to Azure Functions
        if: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE != '' && secrets.AZURE_FUNCTIONAPP_NAME != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
